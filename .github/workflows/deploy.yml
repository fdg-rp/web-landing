# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    
    - name: Announce the build on Discord
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Release build started"
        colour: "5793266"
        description: "Building the site before it is copied to the server."

    - name: Set Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: yarn
      
    - name: Run install
      uses: borales/actions-yarn@v5
      with:
        cmd: install # will run `yarn install` command
        
    - name: Generate
      uses: borales/actions-yarn@v5
      with:
        cmd: generate # will run `yarn install` command
        
    - name: List files
      run: ls built/public

    # Checks the generated site before anything on the server changes:
    # every page built, the sitemap and search index, links.
    - name: Test the generated site
      run: yarn test

    # The new site is uploaded next to the live one first (a staging folder
    # in the deploy user's home), so a failed or slow upload never touches
    # what visitors see.
    - name: Upload the site to a staging folder
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USERNAME }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: built/public/*
        target: .deploy/web-landing-next
        strip_components: 2
        rm: true

    # Then the live folder is brought in line with it on the server itself,
    # which takes a second. Top-level dotfiles in the live folder (such as
    # .well-known/) are left alone, as the old `rm -rf *` did.
    - name: Swap the staged site in
      uses: appleboy/ssh-action@v1.2.5
      env:
        LIVE: ${{ vars.DEPLOY_DIRECTORY }}
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USERNAME }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        envs: LIVE
        script: |
          set -eu
          next="$HOME/.deploy/web-landing-next"
          test -n "$LIVE"
          test -d "$LIVE"
          test -f "$next/index.html" || { echo "staged site is incomplete"; exit 1; }
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --checksum --delete --exclude='/.*' "$next/" "$LIVE/"
          else
            echo "rsync not found: replacing the files from the staged copy"
            find "$LIVE" -mindepth 1 -maxdepth 1 ! -name '.*' -exec rm -rf {} +
            cp -a "$next/." "$LIVE/"
          fi

    - name: Report the halted deploy on Discord
      if: failure()
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Deploy halted"
        colour: "15548997"
        description: "A step failed; unless it was the final swap, the live site is unchanged. See the run for which step."

    - name: Report the deployed site on Discord
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Site deployed"
        colour: "5763719"
        description: "The generated site has been copied to the web server."
