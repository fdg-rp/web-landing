# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
    
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
    
    - name: Announce the build on Discord
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Release build started"
        colour: "5793266"
        description: "Building the site before it is copied to the server."

    - name: Set Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: yarn
      
    - name: Run install
      uses: borales/actions-yarn@v5
      with:
        cmd: install # will run `yarn install` command
        
    - name: Generate
      uses: borales/actions-yarn@v5
      with:
        cmd: generate # will run `yarn install` command
        
    - name: List files
      run: ls built/public
      
    - name: Remove remote files
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USERNAME }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        script: cd ${{ vars.DEPLOY_DIRECTORY }} && rm -rf *
        
    - name: Copy generated files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USERNAME }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: built/public/*
        target: ${{ vars.DEPLOY_DIRECTORY }}
        strip_components: 2

    - name: Report the halted deploy on Discord
      if: failure()
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Deploy halted: build failed"
        colour: "15548997"
        description: "The site was not built or copied; nothing on the server changed."

    - name: Report the deployed site on Discord
      continue-on-error: true
      uses: ./.github/actions/discord-notify
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        title: "Site deployed"
        colour: "5763719"
        description: "The generated site has been copied to the web server."
